<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--first step: include the responsive base styles-->
    <link rel="stylesheet" href="responsive-base.css">
    <title>ExploreUganda</title>

</head>
<body>
    <div class="body">
        <div class="Navbar1">

            <div class="logoContainer"><img src="logo1.png" alt="logo" class="logo1"></div>
            
            <h4>Explore<span class="HighlightUganda">Uganda</span></h4>
            <label class="HomeLabel">Home</label>
            <label class="TabLabels">Destinations</label>
            <label class="TabLabels">National Parks</label>
            <label class="TabLabels">Experience</label>
            <label class="TabLabels">About</label>
            <label class="TabLabels">Contact</label>
            <button type="button" class="BookTripButton">Book a Trip</button>

        </div>
        <div class="section2">
            <label class="WelcomeToUganda">WELCOME TO UGANDA</label>
            <h1 class="Discover">Discover the Pearl of </br>Africa</h1>
            <label class="DiscoverCaption">Mountain gorillas, roaring waterfalls, vast savannas and warm, </br>
                welcoming people. Plan an unforgettable journey with local </br>
                experts.
            </label>
        </div>
        <div class="section3">
            <div class="Navbar2">
                <div class="SolidRightBorder">
                    <p class="Navbar2Headers">
                        <b>DESTINATION</b>
                    </p>
                    <p class="Navbar2Options">
                        Anywhere in </br>
                        Uganda
                    </p>
                </div>
                <div class="SolidRightBorder">
                    <p class="Navbar2Headers">
                        <b>EXPERIENCE</b>
                    </p>
                    <p class="Navbar2Options">
                        Gorilla trekking
                    </p>
                </div>
                <div class="SolidRightBorder">
                    <p class="Navbar2Headers">
                        <b>WHEN</b>
                    </p>
                    <p class="Navbar2Options">
                        Select month
                    </p>
                </div>
                <div class="SolidRightBorder">
                    <p class="Navbar2Headers">
                        <b>TRAVELLERS</b>
                    </p>
                    <p class="Navbar2Options">
                        2 adults
                    </p>
                </div>
                <div class="Navbar2Search">
                    Search Trips
                </div>
            </div>
            

        </div>
    </div>
</body>
</html>
